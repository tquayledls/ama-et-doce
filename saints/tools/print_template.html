<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{NAME}}: Saint of the Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Alegreya+Sans+SC:wght@500;700&family=Cormorant+Unicase:wght@500;600&display=swap">
<style>
/* Pocket prayer-book leaf: 4 × 6 in, black text with red rubrics, footnotes at the foot of each page. */
:root {
  --ink: #1a1a1a;
  --rubric: #a3191d;      /* liturgical red for headings and rubrics */
  --muted: #555;
  --rule: #b9b4aa;
  --lit: {{COLOR}};
  --display: "Cormorant Unicase", "Cormorant Garamond", Georgia, serif;
  --body: "Alegreya", Georgia, "Times New Roman", serif;
  --label: "Alegreya Sans SC", "Gill Sans", sans-serif;
}
@page {
  size: 4in 6in;
  margin: 0.42in 0.38in 0.5in 0.38in;
  @top-center { content: string(saint); font-family: var(--label); font-size: 6.5pt; letter-spacing: .08em; color: var(--muted); }
  @bottom-center { content: counter(page); font-family: var(--body); font-size: 7.5pt; color: var(--muted); }
  @footnote { border-top: 0.5pt solid var(--rule); padding-top: 3pt; margin-top: 6pt; }
}
@page :first { @top-center { content: none; } @bottom-center { content: none; } }

html { color: var(--ink); }
body { margin: 0; font-family: var(--body); font-size: 8.6pt; line-height: 1.38; hyphens: auto; -webkit-hyphens: auto; text-align: left; orphans: 2; widows: 2; }
* { text-align-last: auto !important; }

.title-page { display: flex; flex-direction: column; align-items: center; text-align: center; }
.title-page + section { break-before: page; }
.title-page .eyebrow { font-family: var(--label); font-size: 6.6pt; letter-spacing: .09em; color: var(--rubric); line-height: 1.35; }
.title-page .eyebrow .lit { display: inline-block; width: 5pt; height: 5pt; border-radius: 50%; background: var(--lit); border: .4pt solid var(--muted); vertical-align: middle; margin-right: 3pt; }
.title-page h1 { string-set: saint content(text); font-family: var(--display); font-weight: 600; font-size: 19pt; line-height: 1.02; margin: 5pt 0 2pt; }
.title-page .titles { font-style: italic; font-size: 8pt; color: var(--muted); margin: 0 0 6pt; }
.title-page figure { margin: 0; display: flex; flex-direction: column; align-items: center; }
.title-page img { display: block; height: 3.25in; width: auto; max-width: 100%; object-fit: contain; border: .5pt solid var(--rule); padding: 2pt; background: #fff; }
.title-page figcaption { font-size: 6.6pt; line-height: 1.3; color: var(--muted); margin-top: 3pt; max-width: 2.9in; text-align: center; hyphens: manual; }
.title-page .cross { font-size: 9pt; color: var(--rubric); margin-top: 4pt; }

h3 { font-family: var(--label); font-weight: 700; font-size: 7.6pt; letter-spacing: .08em; color: var(--rubric); text-align: left; margin: 9pt 0 3pt; break-after: avoid; hyphens: manual; }
h3::before { content: "✠ "; }
p { margin: 0 0 4pt; }
ul, ol { margin: 0 0 4pt; padding-left: 11pt; }
li { margin: 0 0 2pt; }
li::marker { color: var(--rubric); }
strong { font-weight: 700; }
a { color: inherit; text-decoration: none; }
.intro p:first-child::first-letter { font-family: var(--display); font-size: 2.6em; float: left; line-height: .8; padding: 1pt 2pt 0 0; color: var(--rubric); }
section.quote p { padding-left: 6pt; border-left: .8pt solid var(--rubric); }

.closing { text-align: center; font-style: italic; margin-top: 8pt; }

/* Footnotes: numbers are written by the builder so they never repeat */
sup.call { font-family: var(--label); font-size: 5.6pt; line-height: 0; color: var(--rubric); font-style: normal; font-weight: 500; margin-left: .4pt; }
.fn { float: footnote; font-size: 6.3pt; line-height: 1.28; text-align: left; hyphens: manual; color: var(--ink); font-style: normal; font-weight: 400; text-indent: 0; padding-left: 0; border: 0; }
.fn::footnote-call { content: none; }
.fn::footnote-marker { content: none; }
.fn .num { font-family: var(--label); color: var(--rubric); }
</style>
<script src="{{PAGED}}"></script>
</head>
<body>
<section class="title-page">
  <div class="eyebrow"><span class="lit"></span>{{DATE}}{{OCCASION_LINE}}</div>
  <h1>{{NAME}}</h1>
  <p class="titles">{{TITLES}} · Feast, {{FEAST}}</p>
  <figure>
    <img src="{{IMG}}" alt="{{IMG_TITLE}}">
    <figcaption><em>{{IMG_TITLE}}</em>, {{IMG_ARTIST}}{{IMG_NOTE}}</figcaption>
  </figure>
  <div class="cross">✠</div>
</section>
{{BODY}}
</body>
</html>
