# Netlify: publish the Saint of the Day website. No build step; the daily routine
# commits finished files to saints/site and Netlify redeploys on every push.
[build]
  publish = "saints/site"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=300"
